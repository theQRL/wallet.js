name: Lint GitHub Actions

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The action defaults to `version: latest`, which resolves the
          # actionlint binary at run time — pin the engine like the action
          # itself. Keep in step with the brew-installed version used
          # locally (CONTRIBUTING.md "Pinned verification inputs").
          version: '1.7.10'

  zizmor:
    name: zizmor (Actions security analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      security-events: write # upload SARIF to GitHub Advanced Security
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          persona: pedantic
          config: .github/zizmor.yml
